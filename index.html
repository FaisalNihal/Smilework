<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smile Corner Merchandiser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E2231A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Smile Corner: Colgate red, a white "smile" curve as the signature shape, rounded white cards. */
:root {
  --red: #E2231A;  --red-deep: #B3121A;  --red-soft: #FDECEB;  --on-red: #FFFFFF;
  --sky: #0B6FCB;  --sky-soft: #E6F0FB;
  --ink: #1A1D21;  --steel: #6B7178;  --line: #ECE6E6;  --mist: #F5F1F1;  --paper: #FFFFFF;  --page: #F7F5F5;
  --ok: #0E8A4F;   --ok-bg: #E3F5EB;
  --warn: #9E5A00; --warn-bg: #FFF0D8;
  --bad: #C4161C;  --bad-bg: #FDE6E6;
  --wait: #56606A; --wait-bg: #EDEFF1;
  --scrim: rgba(18, 12, 12, .55);
  --shadow: 0 1px 2px rgba(80, 20, 20, .06), 0 4px 14px rgba(80, 20, 20, .06);
  --font: 'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', system-ui, sans-serif;
  --display: 'Baloo Da 2', 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  --t-xs: 12px; --t-sm: 13.5px; --t-md: 15.5px; --t-lg: 18px; --t-xl: 24px;
  --tab-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #FF4A40; --red-deep: #E2231A; --red-soft: #3A1715; --sky: #5BA8F0; --sky-soft: #132A40;
    --ink: #EEF0F2; --steel: #A3ABB3; --line: #30353A; --mist: #24282C; --paper: #1B1E21; --page: #121416;
    --ok: #4CC488; --ok-bg: #12301F; --warn: #F0B356; --warn-bg: #36280F; --bad: #FF6A6E; --bad-bg: #3A1517;
    --wait: #B7C0C8; --wait-bg: #252B31; --scrim: rgba(0, 0, 0, .65); --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #FF4A40; --red-deep: #E2231A; --red-soft: #3A1715; --sky: #5BA8F0; --sky-soft: #132A40;
  --ink: #EEF0F2; --steel: #A3ABB3; --line: #30353A; --mist: #24282C; --paper: #1B1E21; --page: #121416;
  --ok: #4CC488; --ok-bg: #12301F; --warn: #F0B356; --warn-bg: #36280F; --bad: #FF6A6E; --bad-bg: #3A1517;
  --wait: #B7C0C8; --wait-bg: #252B31; --scrim: rgba(0, 0, 0, .65); --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: var(--t-md); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--red); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; font-family: var(--display); }
h1 { font-size: var(--t-xl); font-weight: 700; }
h2 { font-size: var(--t-lg); font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--steel); }
.small { font-size: var(--t-sm); }

/* ---------- frame: red header with a smile-curved bottom edge ---------- */
.shell { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--red); color: var(--on-red);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px; display: flex; align-items: center; gap: 12px;
  border-radius: 0 0 50% 50% / 0 0 14px 14px;
}
.mark { width: 36px; height: 36px; flex: none; }
.who { flex: 1; min-width: 0; line-height: 1.25; }
.who b { display: block; font-family: var(--display); font-size: var(--t-md); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: var(--t-xs); opacity: .85; }
.demo-pill { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; background: rgba(255,255,255,.22); padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
.sync { font-size: var(--t-xs); font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 0; background: rgba(255,255,255,.18); color: var(--on-red); white-space: nowrap; }
.sync.ok::before, .sync.warn::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: #7CF0B0; }
.sync.warn::before { background: #FFD27A; }
.topbar .iconbtn { border: 0; background: rgba(255,255,255,.18); color: var(--on-red); }
.iconbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
main {
  flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tab-h) + 30px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.banner { padding: 9px 12px; border-radius: 12px; font-size: var(--t-sm); display: flex; gap: 10px; align-items: center; }
.banner.notice { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--wait-bg); color: var(--wait); }
.banner.off { background: var(--ink); color: var(--paper); }
.banner button { margin-left: auto; border: 0; background: transparent; font-weight: 700; color: inherit; text-decoration: underline; white-space: nowrap; }

/* ---------- bottom tabs, camera raised in a red circle ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .in { max-width: 560px; margin: 0 auto; display: flex; height: var(--tab-h); }
.tab { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; color: var(--steel); position: relative; min-width: 0; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--red); font-weight: 700; }
.tab.shoot svg { width: 26px; height: 26px; }
.tab.shoot i { width: 56px; height: 56px; border-radius: 50%; background: var(--red); color: var(--on-red); display: grid; place-items: center; margin-top: -26px;
  box-shadow: 0 6px 16px rgba(226, 35, 26, .35); border: 4px solid var(--paper); }
.tab.shoot[aria-current="page"] i { background: var(--red-deep); }
.tab .dot { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 999px; background: var(--red); color: var(--on-red); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }

/* ---------- controls ---------- */
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: var(--t-md); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; }
.btn svg { width: 21px; height: 21px; }
.btn.primary { background: var(--red); color: var(--on-red); box-shadow: 0 4px 12px rgba(226, 35, 26, .25); }
.btn.primary:active { background: var(--red-deep); }
.btn.ghost { background: var(--mist); color: var(--ink); }
.btn.line { background: var(--paper); border: 1px solid var(--line); color: var(--ink); }
.btn.white { background: #fff; color: var(--red); }
.btn.big { min-height: 60px; font-size: var(--t-lg); border-radius: 18px; font-family: var(--display); }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: var(--t-sm); border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--t-sm); font-weight: 600; }
.input, select.input, textarea.input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); padding: 11px 12px; min-height: 48px; font-weight: 400; }
.input:focus { border-color: var(--red); outline: none; }
textarea.input { min-height: 84px; resize: vertical; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.filters select { min-height: 42px; padding: 8px 10px; font-size: var(--t-sm); }
.card { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- My Day: red hero with a progress ring ---------- */
.hero { background: linear-gradient(160deg, var(--red) 0%, var(--red-deep) 100%); color: var(--on-red); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; bottom: -70px; width: 220px; height: 140px; border-bottom: 10px solid rgba(255,255,255,.14); border-radius: 0 0 50% 50%; pointer-events: none; }
.hero .top { display: flex; align-items: center; gap: 16px; }
.ring { width: 92px; height: 92px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1; }
.ring b small { display: block; font-size: 11px; font-weight: 600; opacity: .85; text-align: center; margin-top: 2px; }
.hero h1 { font-size: 26px; font-weight: 800; }
.hero .date { font-size: var(--t-sm); opacity: .9; }
.hero .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: relative; z-index: 1; }
.hero .stats4 div { background: rgba(255,255,255,.14); border-radius: 12px; padding: 7px 4px; text-align: center; min-width: 0; }
.hero .stats4 b { display: block; font-size: var(--t-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero .stats4 span { font-size: 11px; opacity: .85; }
.hero .btn.white { position: relative; z-index: 1; }
.daystrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.daystrip div { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 6px; text-align: center; min-width: 0; }
.daystrip b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.daystrip span { font-size: var(--t-xs); color: var(--steel); }
.datehead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- outlet cards: red stripe = Display, blue stripe = Regular ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.group-title { font-size: var(--t-sm); font-weight: 700; color: var(--steel); padding: 8px 2px 0; display: flex; justify-content: space-between; }
.outlet {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 12px 14px 12px 16px;
  background: var(--paper); border: 0; border-radius: 16px; box-shadow: var(--shadow); text-align: left; width: 100%; position: relative; overflow: hidden;
}
.outlet::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--sky); }
.outlet.disp::before { background: var(--red); }
.outlet .name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.outlet .meta { grid-column: 1; font-size: var(--t-xs); color: var(--steel); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.outlet .side { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.outlet[disabled] { opacity: .5; }
.pips { display: inline-flex; gap: 5px; align-items: center; }
.pips i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line); display: block; background: var(--mist); }
.pips i.on { background: var(--ok); border-color: var(--ok); }
.pips small { display: none; }
.tag { font-size: var(--t-xs); padding: 1px 8px; border-radius: 999px; background: var(--mist); color: var(--steel); white-space: nowrap; }
.today-tick { font-size: 11px; color: var(--ok); font-weight: 700; }
.otag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--sky-soft); color: var(--sky); white-space: nowrap; }
.otag.display { background: var(--red-soft); color: var(--red); }

/* ---------- status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-xs); font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.wait { background: var(--wait-bg); color: var(--wait); }

/* ---------- capture ---------- */
.picked { background: var(--paper); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.picked::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 5px; background: var(--sky); }
.picked.disp::before { background: var(--red); }
.picked .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.picked .name { font-family: var(--display); font-size: 21px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.hint { display: flex; gap: 10px; align-items: center; font-size: var(--t-sm); color: var(--steel); background: var(--paper); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
.hint svg { width: 22px; height: 22px; flex: none; color: var(--red); }
.preview-img { width: 100%; border-radius: 18px; display: block; background: var(--mist); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: var(--t-sm); }
.facts dt { color: var(--steel); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.checks-row { display: flex; flex-wrap: wrap; gap: 6px; }
.result { border-radius: 22px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; background: var(--paper); box-shadow: var(--shadow); }
.result .big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
.result.ok .big { background: var(--ok-bg); color: var(--ok); }
.result.warn .big { background: var(--warn-bg); color: var(--warn); }
.result.bad .big { background: var(--bad-bg); color: var(--bad); }
.result.wait .big { background: var(--wait-bg); color: var(--wait); }
.result h2 { font-size: 21px; }
.result p { color: var(--steel); font-size: var(--t-sm); }
.full { background: var(--warn-bg); color: var(--warn); border-radius: 16px; padding: 14px; font-weight: 600; text-align: center; }

/* ---------- photos ---------- */
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.photo { display: flex; flex-direction: column; gap: 4px; min-width: 0; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 6px 6px 10px; }
.photo .img { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; background: var(--mist) center / cover no-repeat; position: relative; overflow: hidden; }
.photo .img .chip { position: absolute; left: 6px; top: 6px; }
.photo b { font-size: var(--t-sm); overflow-wrap: anywhere; padding: 0 4px; }
.photo span { font-size: var(--t-xs); color: var(--steel); overflow-wrap: anywhere; padding: 0 4px; }
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ---------- progress ---------- */
.bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--mist); }
.bar i { display: block; height: 100%; }
.bar .b2 { background: var(--ok); }
.bar .b1 { background: #F2A93B; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--t-sm); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.seg { display: flex; background: var(--mist); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; font-size: var(--t-sm); border-radius: 9px; color: var(--steel); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--red); box-shadow: var(--shadow); }
.tablewrap { overflow-x: auto; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--steel); }
tr:last-child td { border-bottom: 0; }

/* ---------- admin ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; }
.stats b { display: block; font-family: var(--display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stats span { font-size: var(--t-xs); color: var(--steel); }
.section { display: flex; flex-direction: column; gap: 10px; }
.review { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.review .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.review .pair div { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; background: var(--mist) center / cover no-repeat; position: relative; }
.review .pair div span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: var(--scrim); color: #fff; padding: 1px 7px; border-radius: 999px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.switch input { width: 46px; height: 26px; accent-color: var(--red); flex: none; }

/* ---------- login: red top with the smile ---------- */
.login-wrap { min-height: 100vh; display: flex; flex-direction: column; background: var(--page); }
.login-top { background: linear-gradient(170deg, var(--red), var(--red-deep)); color: #fff; padding: calc(36px + env(safe-area-inset-top, 0px)) 20px 70px; text-align: center; border-radius: 0 0 50% 50% / 0 0 48px 48px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.login-top .mark { width: 76px; height: 76px; }
.login-top h1 { font-size: 32px; font-weight: 800; }
.login-top p { opacity: .9; }
.login { width: min(420px, calc(100% - 32px)); margin: -48px auto 32px; background: var(--paper); border-radius: 22px; box-shadow: 0 10px 30px rgba(80, 20, 20, .12); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.pin { letter-spacing: .6em; text-align: center; font-size: 26px; font-variant-numeric: tabular-nums; }
.error { color: var(--bad); font-size: var(--t-sm); min-height: 1.2em; }

.empty { padding: 28px 8px; text-align: center; color: var(--steel); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: var(--t-sm); max-width: calc(100% - 32px); }
.spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--red); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sheet-bg { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* ---------- guided camera (always dark: it is a viewfinder) ---------- */
.cam { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; display: flex; flex-direction: column; }
.cam video, .cam canvas.feed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cam canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cam .hud-top { position: relative; z-index: 2; padding: calc(12px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 12px max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px; background: linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,0)); }
